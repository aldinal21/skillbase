{{define "sidebar.html"}}
<!-- Mobile Backdrop Overlay -->
<div x-show="mobileSidebarOpen"
     x-transition:enter="transition-opacity ease-linear duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition-opacity ease-linear duration-300"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="mobileSidebarOpen = false"
     class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 md:hidden"
     style="display: none;">
</div>

<!-- Sidebar Drawer / Panel -->
<aside class="fixed top-0 bottom-0 left-0 z-50 bg-slate-900 border-r border-slate-800/80 flex flex-col transition-all duration-300 select-none shadow-xl md:shadow-none"
       :class="{
           '-translate-x-full md:translate-x-0': !mobileSidebarOpen,
           'translate-x-0': mobileSidebarOpen,
           'w-64': !desktopSidebarCollapsed || mobileSidebarOpen,
           'w-20': desktopSidebarCollapsed && !mobileSidebarOpen
       }">

    <!-- Sidebar Header -->
    <div class="h-16 px-4 flex items-center justify-between border-b border-slate-800/80">
        <!-- Logo & Title -->
        <div class="flex items-center space-x-3 overflow-hidden">
            <div class="w-9 h-9 min-w-[2.25rem] rounded-lg bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <div x-show="!desktopSidebarCollapsed || mobileSidebarOpen" class="truncate">
                <h1 class="text-base font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent truncate">
                    SkillCraft
                </h1>
                <p class="text-[10px] text-slate-400 font-medium truncate">Agent Skill Manager</p>
            </div>
        </div>

        <!-- Desktop Collapse/Expand Toggle Button -->
        <button type="button"
                @click="desktopSidebarCollapsed = !desktopSidebarCollapsed"
                class="hidden md:flex items-center justify-center p-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 transition-colors focus:outline-none"
                :title="desktopSidebarCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'">
            <svg class="w-5 h-5 transition-transform duration-300"
                 :class="{ 'rotate-180': desktopSidebarCollapsed }"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
            </svg>
        </button>

        <!-- Mobile Close Button -->
        <button type="button"
                @click="mobileSidebarOpen = false"
                class="md:hidden p-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 transition-colors focus:outline-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- Navigation Section -->
    <div class="flex-1 overflow-y-auto px-3 py-4 space-y-6 scrollbar-thin scrollbar-thumb-slate-800">
        <!-- Main Filters -->
        <div>
            <p x-show="!desktopSidebarCollapsed || mobileSidebarOpen" class="px-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2">
                Filter Vault
            </p>
            <nav class="space-y-1">
                <!-- All Skills -->
                <button type="button"
                        hx-get="/skills/search?source="
                        hx-target="#skill-grid-container"
                        hx-swap="outerHTML"
                        @click="activeFilter = 'all'; if (window.innerWidth < 768) mobileSidebarOpen = false"
                        class="w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-all group relative"
                        :class="activeFilter === 'all' 
                            ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' 
                            : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 border border-transparent'">
                    <span class="text-base group-hover:scale-110 transition-transform">⚡</span>
                    <span x-show="!desktopSidebarCollapsed || mobileSidebarOpen" class="ml-3 truncate">All Skills</span>
                    <!-- Tooltip for collapsed desktop -->
                    <span x-show="desktopSidebarCollapsed && !mobileSidebarOpen" 
                          class="absolute left-full ml-2 px-2.5 py-1 bg-slate-800 text-slate-200 text-xs rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
                        All Skills
                    </span>
                </button>

                <!-- Custom Skills -->
                <button type="button"
                        hx-get="/skills/search?source=custom"
                        hx-target="#skill-grid-container"
                        hx-swap="outerHTML"
                        @click="activeFilter = 'custom'; if (window.innerWidth < 768) mobileSidebarOpen = false"
                        class="w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-all group relative"
                        :class="activeFilter === 'custom' 
                            ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' 
                            : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 border border-transparent'">
                    <span class="text-base group-hover:scale-110 transition-transform">🛠️</span>
                    <span x-show="!desktopSidebarCollapsed || mobileSidebarOpen" class="ml-3 truncate">Custom Skills</span>
                    <span x-show="desktopSidebarCollapsed && !mobileSidebarOpen" 
                          class="absolute left-full ml-2 px-2.5 py-1 bg-slate-800 text-slate-200 text-xs rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
                        Custom Skills
                    </span>
                </button>

                <!-- GitHub Skills -->
                <button type="button"
                        hx-get="/skills/search?source=github"
                        hx-target="#skill-grid-container"
                        hx-swap="outerHTML"
                        @click="activeFilter = 'github'; if (window.innerWidth < 768) mobileSidebarOpen = false"
                        class="w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium transition-all group relative"
                        :class="activeFilter === 'github' 
                            ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' 
                            : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 border border-transparent'">
                    <span class="text-base group-hover:scale-110 transition-transform">📦</span>
                    <span x-show="!desktopSidebarCollapsed || mobileSidebarOpen" class="ml-3 truncate">GitHub Skills</span>
                    <span x-show="desktopSidebarCollapsed && !mobileSidebarOpen" 
                          class="absolute left-full ml-2 px-2.5 py-1 bg-slate-800 text-slate-200 text-xs rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
                        GitHub Skills
                    </span>
                </button>
            </nav>
        </div>

        <!-- Agent Targets Section -->
        <div>
            <p x-show="!desktopSidebarCollapsed || mobileSidebarOpen" class="px-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2">
                Agent Targets ({{len .Targets}})
            </p>
            <div class="space-y-1">
                {{range .Targets}}
                <div class="flex items-center px-3 py-2 rounded-lg text-xs font-medium text-slate-300 bg-slate-800/40 border border-slate-800/60 group relative">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
                    <span x-show="!desktopSidebarCollapsed || mobileSidebarOpen" class="ml-2.5 truncate flex-1">{{.Name}}</span>
                    <span x-show="desktopSidebarCollapsed && !mobileSidebarOpen" 
                          class="absolute left-full ml-2 px-2.5 py-1 bg-slate-800 text-slate-200 text-xs rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
                        {{.Name}} ({{.Type}})
                    </span>
                </div>
                {{else}}
                <p x-show="!desktopSidebarCollapsed || mobileSidebarOpen" class="px-3 text-xs text-slate-500 italic">No targets configured</p>
                {{end}}
            </div>
        </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="p-3 border-t border-slate-800/80 bg-slate-900/50">
        <div class="flex items-center justify-between text-xs text-slate-400">
            <span x-show="!desktopSidebarCollapsed || mobileSidebarOpen" class="truncate font-mono">v1.0.0</span>
            <span x-show="!desktopSidebarCollapsed || mobileSidebarOpen" class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                Online
            </span>
        </div>
    </div>
</aside>
{{end}}
