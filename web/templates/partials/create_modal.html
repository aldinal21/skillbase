{{define "create_modal.html"}}
<!-- Create/Edit Skill Modal -->
<div x-show="createModalOpen"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/80 backdrop-blur-sm p-4 sm:p-6 md:p-10 flex items-center justify-center"
     style="display: none;">

    <div class="relative w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]"
         @click.away="createModalOpen = false">

        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
            <h3 class="text-lg font-bold text-slate-100 flex items-center space-x-2">
                <span x-text="editMode ? 'Edit Agent Skill' : 'Create Custom Skill'"></span>
            </h3>
            <button type="button" @click="createModalOpen = false" class="text-slate-400 hover:text-slate-200 text-xl font-bold">&times;</button>
        </div>

        <!-- Modal Body & Form -->
        <form hx-post="/skills"
              hx-target="#skill-grid-container"
              hx-swap="outerHTML"
              @htmx:after-request="if(event.detail.successful) { createModalOpen = false; }"
              class="flex-1 flex flex-col overflow-hidden">

            <input type="hidden" name="id" :value="skillId">

            <div class="p-6 space-y-4 overflow-y-auto flex-1">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Skill Name -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Skill Name *</label>
                        <input type="text"
                               name="name"
                               x-model="skillName"
                               required
                               placeholder="e.g., Code Reviewer Agent"
                               class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <!-- Slug (Optional / Auto-generated) -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Slug (Folder Name)</label>
                        <input type="text"
                               name="slug"
                               x-model="skillSlug"
                               placeholder="e.g., code-reviewer-agent (auto-generated if blank)"
                               class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-xs">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Description -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Short Description</label>
                        <input type="text"
                               name="description"
                               x-model="skillDescription"
                               placeholder="Brief overview of skill purpose..."
                               class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <!-- Tags -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Tags (Comma-separated)</label>
                        <input type="text"
                               name="tags"
                               x-model="skillTags"
                               placeholder="e.g., go, testing, security"
                               class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- Markdown Content Split Editor & Live Preview -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-300">Skill Content (`SKILL.md`) *</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 h-64">
                        <!-- Raw Markdown Textarea -->
                        <textarea name="content"
                                  x-model="skillContent"
                                  required
                                  placeholder="# Skill Name&#10;&#10;Instructions for agent..."
                                  class="w-full h-full p-3 bg-slate-950 border border-slate-800 rounded-lg text-slate-100 font-mono text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>

                        <!-- Live Markdown Preview -->
                        <div class="w-full h-full p-3 bg-slate-950/60 border border-slate-800/80 rounded-lg overflow-y-auto prose prose-invert prose-xs max-w-none text-slate-300 text-xs"
                             x-html="marked.parse(skillContent || '*Markdown live preview will appear here...*')">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-slate-800 bg-slate-900/90 flex items-center justify-end space-x-3">
                <button type="button"
                        @click="createModalOpen = false"
                        class="px-4 py-2 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700/50 transition-all">
                    Cancel
                </button>
                <button type="submit"
                        class="px-4 py-2 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow-md shadow-indigo-600/20 transition-all">
                    Save Skill
                </button>
            </div>
        </form>
    </div>
</div>

<!-- GitHub Import Modal -->
<div x-show="importModalOpen"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/80 backdrop-blur-sm p-4 sm:p-6 md:p-10 flex items-center justify-center"
     style="display: none;">

    <div class="relative w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden"
         @click.away="importModalOpen = false">

        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
            <h3 class="text-base font-bold text-slate-100 flex items-center space-x-2">
                <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span>Import Skill from GitHub</span>
            </h3>
            <button type="button" @click="importModalOpen = false" class="text-slate-400 hover:text-slate-200 text-xl font-bold">&times;</button>
        </div>

        <!-- Modal Body & Form -->
        <form hx-post="/skills/import"
              hx-target="#skill-grid-container"
              hx-swap="outerHTML"
              @htmx:after-request="if(event.detail.successful) { importModalOpen = false; }"
              class="p-6 space-y-4">

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">GitHub File / Blob URL *</label>
                <input type="text"
                       name="url"
                       x-model="importUrl"
                       required
                       placeholder="https://github.com/user/repo/blob/main/skills/SKILL.md"
                       class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500 font-mono text-xs">
                <p class="text-[11px] text-slate-500 mt-1">Supports links to raw or blob GitHub markdown files containing agent skills.</p>
            </div>

            <!-- Modal Footer -->
            <div class="pt-4 border-t border-slate-800 flex items-center justify-end space-x-3">
                <button type="button"
                        @click="importModalOpen = false"
                        class="px-4 py-2 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700/50 transition-all">
                    Cancel
                </button>
                <button type="submit"
                        class="px-4 py-2 text-xs font-medium text-white bg-purple-600 hover:bg-purple-500 rounded-lg shadow-md shadow-purple-600/20 transition-all">
                    Import Skill
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Add Target Directory Modal -->
<div x-show="targetModalOpen"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/80 backdrop-blur-sm p-4 sm:p-6 md:p-10 flex items-center justify-center"
     style="display: none;">

    <div class="relative w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden"
         @click.away="targetModalOpen = false">

        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
            <h3 class="text-base font-bold text-slate-100 flex items-center space-x-2">
                <span class="text-xl">🎯</span>
                <span>Add Target Agent Directory</span>
            </h3>
            <button type="button" @click="targetModalOpen = false" class="text-slate-400 hover:text-slate-200 text-xl font-bold">&times;</button>
        </div>

        <!-- Modal Body & Form -->
        <form hx-post="/targets"
              hx-target="body"
              @htmx:after-request="if(event.detail.successful) { targetModalOpen = false; }"
              class="p-6 space-y-4">

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Target Name *</label>
                <input type="text"
                       name="name"
                       x-model="targetName"
                       required
                       placeholder="e.g., Antigravity Global Skills or Local Workspace"
                       class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Absolute Directory Path *</label>
                <input type="text"
                       name="path"
                       x-model="targetPath"
                       required
                       placeholder="e.g., C:\Users\name\.gemini\antigravity-cli\skills or .agent/skills"
                       class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-xs">
                <p class="text-[11px] text-slate-500 mt-1">Directory where skills will be auto-synced upon deployment.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Agent Type</label>
                <select name="agent_type"
                        x-model="targetAgentType"
                        class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs">
                    <option value="custom">⚙️ Custom / Generic Agent</option>
                    <option value="universal">🌐 Universal (~/.agents/skills)</option>
                    <option value="claude">🤖 Claude Code (~/.claude/skills)</option>
                    <option value="antigravity">⚡ Antigravity CLI (~/.gemini/...)</option>
                    <option value="opencode">💻 OpenCode (~/.opencode/skills)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Sync Mode</label>
                <select name="sync_mode"
                        x-model="targetSyncMode"
                        class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs">
                    <option value="symlink">Hybrid (Symlink with Copy Fallback)</option>
                    <option value="copy">Direct Copy File</option>
                </select>
            </div>

            <!-- Modal Footer -->
            <div class="pt-4 border-t border-slate-800 flex items-center justify-end space-x-3">
                <button type="button"
                        @click="targetModalOpen = false"
                        class="px-4 py-2 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700/50 transition-all">
                    Cancel
                </button>
                <button type="submit"
                        class="px-4 py-2 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow-md shadow-indigo-600/20 transition-all">
                    Add Target
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
