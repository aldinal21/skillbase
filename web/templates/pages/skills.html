{{define "content"}}
<div class="space-y-8">
    <!-- Header Title & Controls -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h2 class="text-2xl font-bold text-slate-100">Skills Library</h2>
            <p class="text-sm text-slate-400">Search, filter, and manage all agent skills in your central vault.</p>
        </div>

        <!-- Filter Source Pills (Custom vs GitHub) -->
        <div class="flex items-center space-x-1.5 bg-slate-900 border border-slate-800 p-1.5 rounded-xl self-start md:self-auto">
            <button type="button"
                    hx-get="/skills/search?source="
                    hx-target="#skill-grid-container"
                    hx-swap="outerHTML"
                    @click="activeFilter = 'all'"
                    :class="activeFilter === 'all' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'"
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5">
                <span>⚡ All Skills</span>
            </button>
            <button type="button"
                    hx-get="/skills/search?source=custom"
                    hx-target="#skill-grid-container"
                    hx-swap="outerHTML"
                    @click="activeFilter = 'custom'"
                    :class="activeFilter === 'custom' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'"
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5">
                <span>🛠️ Custom</span>
            </button>
            <button type="button"
                    hx-get="/skills/search?source=github"
                    hx-target="#skill-grid-container"
                    hx-swap="outerHTML"
                    @click="activeFilter = 'github'"
                    :class="activeFilter === 'github' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'"
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5">
                <span>📦 GitHub</span>
            </button>
        </div>
    </div>

    <!-- Skill Grid Container (HTMX Target) -->
    {{template "skill_list.html" .}}
</div>
{{end}}
